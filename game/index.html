<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0b0e" />
  <meta name="description" content="Game — Abhishek Farswan portfolio." />
  <title>abhishek_farswan.exe — game</title>

  <!-- Shared fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Portfolio shared design tokens -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/topbar.css" />

  <!-- Game-specific styles -->
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/hud.css" />
</head>
<body class="game-body">

  <!-- ── Top nav ──────────────────────────────────── -->
  <nav class="topbar game-topbar">
    <a class="back" href="../index.html"><b>‹</b> /abhishek/portfolio</a>
    <span class="game-title">game.exe</span>
    <span class="game-version" id="gameVersion">v0.1.0</span>
  </nav>

  <!-- ── HUD overlay (above canvas) ──────────────── -->
  <div class="game-hud hidden" id="gameHud">
    <div class="hud-left">
      <div class="hud-stat">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="hudScore">0</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">LEVEL</span>
        <span class="hud-value" id="hudLevel">1</span>
      </div>
    </div>
    <div class="hud-center" id="hudCenter"><!-- e.g. timer, wave --></div>
    <div class="hud-right">
      <div class="hud-stat">
        <span class="hud-label">HP</span>
        <span class="hud-value" id="hudHealth">100</span>
      </div>
      <button class="hud-btn" id="btnPause" title="Pause (Esc)">⏸</button>
    </div>
  </div>

  <!-- ── Game wrapper ─────────────────────────────── -->
  <div class="game-wrapper" id="gameWrapper">

    <!-- Primary render canvas -->
    <canvas id="gameCanvas" class="game-canvas"></canvas>

    <!-- BOOT screen -->
    <div class="game-screen active" id="screenBoot">
      <div class="boot-logo">
        <div class="boot-glitch" data-text="GAME.EXE">GAME.EXE</div>
        <div class="boot-sub">abhishek_farswan · portfolio</div>
      </div>
      <div class="boot-progress-wrap">
        <div class="boot-bar" id="bootBar" style="width:0%"></div>
      </div>
      <div class="boot-log" id="bootLog">
        <div class="boot-line">> initializing…</div>
      </div>
    </div>

    <!-- MAIN MENU screen -->
    <div class="game-screen" id="screenMenu">
      <div class="menu-content">
        <h1 class="menu-title" data-text="GAME.EXE">GAME.EXE</h1>
        <p class="menu-tagline">// enter the world</p>
        <nav class="menu-nav">
          <button class="menu-btn primary" id="btnNewGame">[ NEW GAME ]</button>
          <button class="menu-btn"         id="btnContinue" disabled>[ CONTINUE ]</button>
          <button class="menu-btn"         id="btnSettings">[ SETTINGS ]</button>
          <button class="menu-btn danger"  id="btnExit" onclick="window.location='../index.html'">[ EXIT TO PORTFOLIO ]</button>
        </nav>
      </div>
    </div>

    <!-- GAMEPLAY screen (canvas occupies this space) -->
    <div class="game-screen" id="screenGame"></div>

    <!-- PAUSE screen -->
    <div class="game-screen" id="screenPause">
      <div class="overlay-box">
        <div class="overlay-title">— PAUSED —</div>
        <nav class="menu-nav">
          <button class="menu-btn primary" id="btnResume">[ RESUME ]</button>
          <button class="menu-btn"         id="btnPauseSettings">[ SETTINGS ]</button>
          <button class="menu-btn danger"  id="btnQuitToMenu">[ QUIT TO MENU ]</button>
        </nav>
      </div>
    </div>

    <!-- GAME OVER screen -->
    <div class="game-screen" id="screenGameOver">
      <div class="overlay-box">
        <div class="overlay-title gameover-title">GAME OVER</div>
        <div class="gameover-score">SCORE <span id="finalScore">0</span></div>
        <nav class="menu-nav">
          <button class="menu-btn primary" id="btnRetry">[ RETRY ]</button>
          <button class="menu-btn danger"  id="btnGoMenu">[ MAIN MENU ]</button>
        </nav>
      </div>
    </div>

    <!-- SETTINGS screen -->
    <div class="game-screen" id="screenSettings">
      <div class="overlay-box settings-box">
        <div class="overlay-title">SETTINGS</div>
        <div class="settings-list">
          <div class="settings-row">
            <span class="settings-label">SOUND FX</span>
            <label class="toggle"><input type="checkbox" id="toggleSfx" checked><span class="toggle-track"></span></label>
          </div>
          <div class="settings-row">
            <span class="settings-label">MUSIC</span>
            <label class="toggle"><input type="checkbox" id="toggleMusic" checked><span class="toggle-track"></span></label>
          </div>
          <div class="settings-row">
            <span class="settings-label">FULLSCREEN</span>
            <label class="toggle"><input type="checkbox" id="toggleFullscreen"><span class="toggle-track"></span></label>
          </div>
        </div>
        <button class="menu-btn" id="btnSettingsBack">[ BACK ]</button>
      </div>
    </div>

  </div><!-- /.game-wrapper -->

  <!-- Toast notification -->
  <div class="game-toast" id="gameToast"></div>

  <!-- ── JS modules (load order matters) ─────────── -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
