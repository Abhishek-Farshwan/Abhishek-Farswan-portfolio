<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>secret_level.exe</title>
  <link rel="icon" type="image/png" href="user.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0b0e; --panel:#111318; --line:#242830;
      --text:#eef1f5; --muted:#747c88; --accent:#8fe14a;
      --mono:'JetBrains Mono', monospace; --display:'Chakra Petch', sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--mono);
      display:flex;align-items:center;justify-content:center;padding:24px;
      background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.4px);background-size:26px 26px}
    a{color:inherit;text-decoration:none}
    .back{position:fixed;top:20px;left:20px;font-size:13px;color:var(--muted)}
    .back:hover{color:var(--text)}
    .back b{color:var(--accent);font-weight:500}
    .panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:44px 36px;
      max-width:420px;text-align:center}
    .panel .glyph{font-size:34px;margin-bottom:14px}
    .panel h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 10px;color:var(--accent)}
    .panel p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}
    .bar{height:5px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:22px 0}
    .bar-fill{height:100%;width:14%;background:var(--accent)}
  </style>
</head>
<body>
  <a class="back" href="index.html"><b>‹</b> /abhishek/portfolio</a>
  <div class="panel">
    <div class="glyph">🎮</div>
    <h1>build not deployed yet</h1>
    <div class="bar"><div class="bar-fill"></div></div>
    <p>this is where a small playable build will live once it's ready. check back soon, or hit me up if you want a preview early.</p>
  </div>
</body>
</html>
